name: Substack Autopilot

# Writes one post with Claude and sends it to Substack. See tools/substack-autopilot/README.md.
# Manual only until the secrets are set and the output has been checked; uncomment
# `schedule` to run daily.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry, draft or publish'
        required: true
        default: draft
        type: choice
        options: [dry, draft, publish]
  # schedule:
  #   - cron: '17 13 * * *' # daily, 13:17 UTC

concurrency:
  group: substack-autopilot
  cancel-in-progress: false

permissions:
  contents: write # commits topics.txt, posts/ and published.jsonl back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/substack-autopilot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Write and send the post
        env:
          PUBLISH_MODE: ${{ inputs.mode || 'draft' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          SUBSTACK_COOKIES: ${{ secrets.SUBSTACK_COOKIES }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BLOG_NICHE: ${{ vars.BLOG_NICHE }}
          BLOG_AUDIENCE: ${{ vars.BLOG_AUDIENCE }}
          BLOG_VOICE: ${{ vars.BLOG_VOICE }}
        run: python autopilot.py
      - name: Commit the run's output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add topics.txt published.jsonl posts/
          git diff --cached --quiet || git commit -m "chore(substack): post for $(date -u +%F)"
          git push
